org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false
# En este equipo el hosts corporativo (a3software) tiene comentado
# `127.0.0.1 localhost`, lo que rompía la conexión loopback de los workers de
# Gradle ("Unable to establish loopback connection"). Forzar IPv4 + sin daemon lo
# resuelve sin tocar el hosts del sistema.
org.gradle.daemon=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
