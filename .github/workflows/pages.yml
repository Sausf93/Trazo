name: Desplegar web comercial (GitHub Pages)

# Publica apps/landing en GitHub Pages. Al primer push habilita Pages solo
# (enablement: true). La web queda en https://<usuario>.github.io/Trazo/

on:
  push:
    branches: [main]
    paths:
      - 'apps/landing/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Subir la carpeta de la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/landing
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
