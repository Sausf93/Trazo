name: Desplegar web comercial + demo (GitHub Pages)

# Publica en GitHub Pages:
#  - la web comercial (apps/landing) en la raíz
#  - la app de tablet compilada a web, como DEMO jugable, en /demo
# Requiere activar Pages UNA vez: Settings -> Pages -> Source: "GitHub Actions".
# La web queda en https://<usuario>.github.io/Trazo/ y el demo en /Trazo/demo/.

on:
  push:
    branches: [main]
    paths:
      - 'apps/landing/**'
      - 'apps/tablet/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Compilar el demo de la tablet (web)
        working-directory: apps/tablet
        run: |
          flutter pub get
          flutter build web --release --base-href /Trazo/demo/

      - name: Montar el sitio (landing + demo)
        run: |
          mkdir -p _site
          cp -r apps/landing/* _site/
          mkdir -p _site/demo
          cp -r apps/tablet/build/web/* _site/demo/

      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
